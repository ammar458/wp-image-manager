name: Tag and Release

on:
  push:
    branches: [ main ]
    paths:
      - 'wp-image-manager.php'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        run: |
          VERSION=$(grep -m1 -oP '^\s*\*\s*Version:\s*\K[0-9.]+' wp-image-manager.php)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if tag already exists
        id: check_tag
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plugin zip
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          mkdir -p build/wp-image-manager
          rsync -a --exclude='.git' --exclude='.github' --exclude='build' ./ build/wp-image-manager/
          (cd build && zip -r ../wp-image-manager.zip wp-image-manager)

      - name: Create tag and release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: wp-image-manager.zip